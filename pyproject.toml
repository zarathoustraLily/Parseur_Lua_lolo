[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lua-parser-pro"
version = "1.1.0"
description = "A dependency-free Lua 5.4 lexer and syntax parser with typed trees, code analysis and a local Studio"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["lua", "parser", "lexer", "ast", "lua54", "flowchart", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Compilers",
]

[project.scripts]
lua-parser = "lua_parser_pro.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lua_parser_pro*"]

[tool.setuptools.package-data]
lua_parser_pro = ["py.typed"]
"lua_parser_pro.studio" = ["static/*", "static/exemples/*", "static/fonts/*"]
